name: DSH Go usage APK

on:
  push:
    branches: [base-v1.1.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usage-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DSH_MAVEN_MIRRORS: '0'
      DSH_GO_SIDE_BY_SIDE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install fonts required by the Flutter test suite
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-cjk-extra
      - name: Prepare app and test daily usage
        env:
          DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter test test/state/daily_usage_state_test.dart
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools'
      - name: Prepare Android SDK
        run: |
          ndk_version=$(python3 -c 'import json; print(json.load(open("runtime/tawcroot/source.json"))["ndkVersion"])')
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$ndk_version"
          printf 'ANDROID_NDK_HOME=%s/ndk/%s\n' "$ANDROID_HOME" "$ndk_version" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: runtime
        with:
          path: runtime/out/arm64-v8a
          key: usage-runtime-arm64-v1-${{ hashFiles('runtime/**') }}
      - name: Build ARM64 runtime
        if: steps.runtime.outputs.cache-hit != 'true'
        run: bash runtime/build-runtime.sh arm64-v8a
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.runtime.outputs.cache-hit != 'true'
        with:
          path: runtime/out/arm64-v8a
          key: ${{ steps.runtime.outputs.cache-primary-key }}
      - name: Build ARM64 APK
        run: bash tooling/build-apk.sh -f arm64 --keep-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-1.1.0-usage-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          compression-level: 0
          if-no-files-found: error
